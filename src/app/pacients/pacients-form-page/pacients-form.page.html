<ion-header>
  <ion-toolbar>
    <ion-title>Style Guide</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-container">

    <div class="page-header">
      <h1 class="axis-page-title">Novo paciente</h1>

      <p class="page-description">
        Preencha as informações básicas do paciente.
      </p>
    </div>

    <section class="axis-card">

      <h2 class="axis-section-title">
        Dados pessoais
      </h2>

      <div class="form-content">

        <mat-form-field appearance="outline">
          <mat-label>Nome do paciente</mat-label>

          <input
            matInput
            placeholder="Digite o nome"
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Telefone</mat-label>

          <input
            matInput
            placeholder="(31) 99999-9999"
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>E-mail</mat-label>

          <input
            matInput
            type="email"
            placeholder="paciente@email.com"
          />
        </mat-form-field>

      </div>

    </section>

    <button
      mat-flat-button
      class="axis-button axis-button--full save-button"
    >
      Salvar paciente
    </button>

  </div>
</ion-content>
